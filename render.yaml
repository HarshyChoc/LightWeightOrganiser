services:
  - type: web
    name: focus-webapp
    env: python
    pythonVersion: 3.11.11
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
    healthCheckPath: /
    autoDeploy: true 